# Alembic config for the api's migrations.
#
# What this file does: points Alembic at the `alembic/` script directory, sets the
# migration filename pattern, a local-dev default database URL, and standard logging.
#
# Used here and why: Alembic's own ini format; `alembic/env.py` reads `sqlalchemy.url`
# from here unless `DATABASE_URL` is set in the environment (compose/CI/prod override it).
#
# How it fits the project: local-dev fallback for the connection Alembic migrates
# (ADR-0001 Postgres backend); `entrypoint.dev.sh` runs `alembic upgrade head` against it.
#
# Depends on: nothing.
# Used by: the `alembic` CLI (invoked by `entrypoint.dev.sh`, CI, and prod deploy steps).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
# Local-dev default; DATABASE_URL from the environment overrides this (see alembic/env.py).
sqlalchemy.url = postgresql+asyncpg://rtapps:rtapps@localhost:5432/rtapps

# Standard Python logging config, boilerplate from Alembic's own template: three loggers
# (root, the SQLAlchemy engine, and alembic itself) sharing one console handler/formatter.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
