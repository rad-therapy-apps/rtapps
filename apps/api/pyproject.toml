[project]
name = "rtapps-api"
version = "0.1.0"
description = "RTApps API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141",
  "uvicorn[standard]>=0.52",
  "pydantic[email]>=2.13",
  "pydantic-settings>=2.15",
  "sqlalchemy[asyncio]>=2.0.52",
  "asyncpg>=0.31",
  "alembic>=1.19",
  "uuid-utils>=0.17.0",
  "argon2-cffi>=25.1.0",
  "itsdangerous>=2.2.0",
  "httpx>=0.28",
  "jsonschema>=4.23",
]

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1.4",
  "ruff>=0.16",
  "mypy>=2.3",
  "asgi-lifespan>=2.1",
  "respx>=0.23.1",
  "types-jsonschema>=4.26.0.20260518",
  "hypothesis>=6.100",
  "pytest-cov>=6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Cookie", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app/grading --cov=app/auth --cov-report=term-missing"
