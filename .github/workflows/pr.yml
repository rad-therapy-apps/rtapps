name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rtapps
          POSTGRES_PASSWORD: rtapps
          POSTGRES_DB: rtapps_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U rtapps -d rtapps_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://rtapps:rtapps@localhost:5433/rtapps_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web lint
      - run: pnpm --filter web check
      - run: pnpm --filter web test

  images:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          load: true
          tags: rtapps-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test api image
        run: docker run --rm rtapps-api:ci python -c "import app.main"
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: rtapps-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test web image
        run: docker run --rm --entrypoint node rtapps-web:ci -e "require('fs').accessSync('build/index.js')"
