# What this file does: on every push to `main` and every `v*` tag, builds multi-arch (amd64 +
#   arm64) Docker images for `api`, `web` and `backup`, pushes them to GHCR, dry-runs the Alembic
#   migration chain against the freshly-built `api` image, then auto-deploys the result to the
#   `test` environment.
# Used here and why: GitHub Actions; a matrix builds all three images in parallel; QEMU + buildx
#   give the arm64 cross-build the test/prod VM needs (ADR-0005). `packages: write` is the least
#   privilege required to push to GHCR with the ambient `GITHUB_TOKEN` (no separate PAT).
#   `concurrency` stops two pushes to `main` from racing the same image tags. The migration
#   dry-run (upgrade → downgrade → upgrade, against a throwaway Postgres) catches a broken
#   migration before it ever reaches a real deploy.
# How it fits the project: docs/adr/0005-single-vm-docker-compose-deployment.md ("Images" and
#   "Migrations" bullets) — images are built here and prod pins by sha; migrations never run on
#   container start. `deploy-test` calls deploy.yml reusably so `test` always tracks the tip of
#   `main`. Deploying to `prod` is never automatic from this workflow — deploy.yml only runs
#   against `prod` via a human-triggered workflow_dispatch, because GitHub Free does not support a
#   required-reviewer rule on Environments; the safeguard here is "a human must run it on
#   purpose", not a reviewer gate.
# Works with: apps/api/Dockerfile, apps/web/Dockerfile, infra/backup/Dockerfile (the three images
#   built here), apps/api/alembic (the migration chain dry-run), .github/workflows/deploy.yml
#   (invoked by `deploy-test`). Used by: pushes to `main` and `v*` tags.
name: main
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: main-${{ github.ref }}
env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/rtapps
jobs:
  # Build and push all three images in parallel, tagged by full sha, by git tag (on a `v*` push)
  # and `latest` (on the default branch only).
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, file: apps/api/Dockerfile, context: . }
          - { name: web, file: apps/web/Dockerfile, context: . }
          - { name: backup, file: infra/backup/Dockerfile, context: infra/backup }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4 # arm64 emulation for the cross-build
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REPO }}-${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Prove the migration chain is reversible against the just-published api image, before any
  # deploy touches a real database: upgrade to head, downgrade to base, upgrade to head again.
  migrate-dry-run:
    runs-on: ubuntu-latest
    needs: images
    # packages: read — this job pulls the just-pushed (private) api image from GHCR; the
    # workflow-level permissions carry contents: read only since the least-privilege split.
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: rtapps, POSTGRES_PASSWORD: rtapps, POSTGRES_DB: rtapps }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rtapps" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # Upgrade to head, downgrade to base, upgrade again — from the *published* api image.
      - run: |
          for cmd in "upgrade head" "downgrade base" "upgrade head"; do
            docker run --rm --network host \
              -e DATABASE_URL=postgresql+asyncpg://rtapps:rtapps@localhost:5432/rtapps \
              -e ENV=test -e SESSION_SECRET=ci-only-secret-with-at-least-32-characters \
              ${{ env.IMAGE_REPO }}-api:${{ github.sha }} alembic $cmd
          done

  # Auto-deploy to `test` only — `prod` is workflow_dispatch-only in deploy.yml (see header).
  deploy-test:
    needs: [images, migrate-dry-run]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    # A called reusable workflow may only hold permissions its caller job grants; deploy.yml
    # declares `packages: read`, so this caller job must grant it explicitly now that
    # workflow-level permissions carry `contents: read` only (least privilege — GitHub
    # refuses to START the whole workflow otherwise, as a startup_failure).
    permissions:
      contents: read
      packages: read
    with: { environment: test, image_tag: "${{ github.sha }}" }
    secrets: inherit
