# What this file does: configures GitHub Dependabot to open PRs for outdated
# dependencies across the repo's package ecosystems, on a weekly schedule.
# Used here and why: one entry per ecosystem/directory that actually has a lockfile in
# this repo — Python deps for the API, the pnpm workspace's JS deps (rooted at `/` since
# pnpm-workspace.yaml covers apps/* and packages/* from there), the GitHub Actions
# workflow versions themselves, the three Dockerfiles' base images (apps/api, apps/web,
# infra/backup), and the digest-pinned images in infra/compose.prod.yaml (db, proxy) via
# the docker-compose ecosystem. No entry for tools/migrate-legacy (not part of the
# deployed system).
# How it fits the project: docs/04-conventions.md §7 (versioning/releases) — keeps
# dependencies from silently drifting between releases.
# Depends on: this repo's lockfiles (apps/api/uv.lock, pnpm-lock.yaml) and Dockerfiles.
# Used by: GitHub's Dependabot service; PRs it opens go through the same pr.yml checks
# as any other PR.
# NOTE(review): tools/migrate-legacy also has its own pyproject.toml/uv.lock but has no
# dependabot entry — likely omitted because it's a one-off migration script, not part of
# the deployed system, but that's not stated anywhere; worth confirming intentional.
version: 2
updates:
  # Python dependencies for the API service (apps/api/pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /apps/api
    schedule: { interval: weekly }
    # Wait a week after a release before proposing it (supply-chain safety); security
    # updates are not delayed by this.
    cooldown: { default-days: 7 }
    # Minor and patch bumps arrive as one PR per ecosystem; majors stay separate so each
    # gets a deliberate look.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Python dependencies for the legacy migration tool (its own pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /tools/migrate-legacy
    schedule: { interval: weekly }
    # Wait a week after a release before proposing it (supply-chain safety); security
    # updates are not delayed by this.
    cooldown: { default-days: 7 }
    # Minor and patch bumps arrive as one PR per ecosystem; majors stay separate so each
    # gets a deliberate look.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # JS/TS dependencies for the whole pnpm workspace (single root lockfile covers
  # apps/web and packages/*, per pnpm-workspace.yaml).
  - package-ecosystem: npm
    directory: /
    ignore:
      # three.js is pinned exactly (0.160.0, the owner-verified perf baseline) and upgraded
      # deliberately, never in the weekly group — patches included, since any change to it needs
      # a simulator perf re-check.
      - dependency-name: three
      # @types/node tracks the Node runtime (24 LTS); its major moves with the Node upgrade.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # TipTap 3.32.0 breaks inserting a callout (RichTextEditor spec); held at 3.31.4 (#153).
      # Only that release is skipped, so a fixed 3.32.x or later is still proposed.
      - dependency-name: '@tiptap/*'
        versions: ['3.32.0']
    schedule: { interval: weekly }
    # Wait a week after a release before proposing it (supply-chain safety); security
    # updates are not delayed by this.
    cooldown: { default-days: 7 }
    # Minor and patch bumps arrive as one PR per ecosystem; majors stay separate so each
    # gets a deliberate look.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Actions used in .github/workflows/*, each pinned to a full commit SHA with its release as a
  # trailing comment (`actions/checkout@<sha> # v7.0.1`, #15) so a moved or hijacked tag can't
  # change what CI runs; Dependabot updates the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    # Wait a week after a release before proposing it (supply-chain safety); security
    # updates are not delayed by this.
    cooldown: { default-days: 7 }
    # Minor and patch bumps arrive as one PR per ecosystem; majors stay separate so each
    # gets a deliberate look.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Base image in apps/api's Dockerfile.
  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: weekly }
    # Wait a week after a release before proposing it (supply-chain safety); security
    # updates are not delayed by this.
    cooldown: { default-days: 7 }
    # Minor and patch bumps arrive as one PR per ecosystem; majors stay separate so each
    # gets a deliberate look.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Base image in apps/web's Dockerfile.
  - package-ecosystem: docker
    directory: /apps/web
    # Odd Node majors (25, 27, 29) are never LTS; even majors are still proposed and held open
    # until they reach LTS.
    ignore:
      - dependency-name: node
        versions: ['>= 25, < 26', '>= 27, < 28', '>= 29, < 30']
    schedule: { interval: weekly }
    # Wait a week after a release before proposing it (supply-chain safety); security
    # updates are not delayed by this.
    cooldown: { default-days: 7 }
    # Minor and patch bumps arrive as one PR per ecosystem; majors stay separate so each
    # gets a deliberate look.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Base images in infra/backup's Dockerfile (minio/mc build stage, alpine runtime).
  - package-ecosystem: docker
    directory: /infra/backup
    schedule: { interval: weekly }
    # Wait a week after a release before proposing it (supply-chain safety); security
    # updates are not delayed by this.
    cooldown: { default-days: 7 }
    # Minor and patch bumps arrive as one PR per ecosystem; majors stay separate so each
    # gets a deliberate look.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Digest-pinned images in infra/compose.prod.yaml (postgres, caddy) — issue #14.
  - package-ecosystem: docker-compose
    directory: /infra
    # Odd Node majors (25, 27, 29) are never LTS; even majors are still proposed and held open
    # until they reach LTS.
    ignore:
      - dependency-name: node
        versions: ['>= 25, < 26', '>= 27, < 28', '>= 29, < 30']
    schedule: { interval: weekly }
    # Wait a week after a release before proposing it (supply-chain safety); security
    # updates are not delayed by this.
    cooldown: { default-days: 7 }
    # Minor and patch bumps arrive as one PR per ecosystem; majors stay separate so each
    # gets a deliberate look.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
