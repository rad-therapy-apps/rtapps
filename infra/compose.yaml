# What this file does: defines the local development stack for `make dev` (docker compose):
#   Postgres, SeaweedFS (S3-compatible object storage) + a one-shot bucket initialiser, the FastAPI
#   `api` (source bind-mounted, auto-reload), the SvelteKit `web` dev server (Vite, HMR), Caddy
#   as the single origin on :8080, and Mailpit to catch outgoing e-mail.
# Used here and why: one compose file so the whole system starts with one command and the dev
#   topology matches production's (proxy → web/api → db/storage, ADR-0005). Healthchecks plus
#   `depends_on: condition: service_healthy` give a deterministic start order; the same file
#   is used unchanged by the CI `e2e` job (.github/workflows/pr.yml) with `--wait`.
# How it fits the project: docs/03-architecture.md §3 (containers) and §10.1 (development);
#   docs/05-setup.md for the day-to-day commands. Values come from ./.env (copied from
#   infra/.env.example by `make dev`); the Makefile passes `--env-file .env`.
# Works with: infra/Caddyfile (proxy routing), apps/api/Dockerfile + entrypoint.dev.sh (api),
#   packages/schemas (mounted read-only for the prose validator), apps/web (bind-mounted repo).
#   Used by: Makefile (dev/down/logs/seed), .github/workflows/pr.yml (e2e job).
name: rtapps

services:
  # Postgres 16 — the only database; data persists in the `pgdata` volume across restarts.
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5442:5432" # exposed so host tools (psql, the API test suite) can reach it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SeaweedFS stands in for S3/R2 locally (ADR-0005); the API only ever speaks the S3 API to it.
  # It replaced MinIO on 2026-10-01: MinIO withdrew its public images (Docker Hub 404, quay.io
  # 401, dl.min.io 410), and CI only kept passing because the self-hosted runner had a stale
  # cached copy. :9000 = S3 API, the same port MinIO used, so S3_ENDPOINT / S3_PUBLIC_ENDPOINT
  # are unchanged (there is no :9001 console any more). The MINIO_ROOT_USER / _PASSWORD names
  # are kept so no .env needs editing; SeaweedFS only takes static credentials from an identity
  # file, so the entrypoint writes them into one before starting (`$$` is compose's escape for
  # a literal `$`, so the shell — not compose — expands the variables). `-ip=127.0.0.1`: the
  # master, volume server, filer and S3 gateway all run in this one container and only talk to
  # each other, so they advertise loopback. Advertising the service name instead made the S3
  # gateway resolve its own name through DNS on every upload, which failed on the CI runner
  # (every PUT answered 500) while working on a laptop. Nothing outside the container needs
  # the volume server's address — clients only speak S3 on :9000.
  storage:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"root","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" > /tmp/s3.json
        exec weed server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0 -volume.max=0 \
          -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - storage-data:/data
    ports:
      - "9000:9000"
    # Healthy = the S3 port accepts connections (the image ships no S3 client; busybox nc does).
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: creates the bucket once storage is healthy, then exits 0. Nothing depends on
  # it, which is why the CI e2e job waits only on proxy/web/api (an exited one-shot would
  # otherwise make `compose up --wait` report a failure). rclone with an env-var remote, the
  # same approach as infra/backup/rclone-remote.sh; `mkdir` on an S3 remote is CreateBucket
  # and is a no-op when the bucket already exists.
  storage-init:
    image: rclone/rclone:1.68
    depends_on:
      storage:
        condition: service_healthy
    environment:
      RCLONE_CONFIG_LOCAL_TYPE: s3
      RCLONE_CONFIG_LOCAL_PROVIDER: Other
      RCLONE_CONFIG_LOCAL_ENDPOINT: http://storage:9000
      RCLONE_CONFIG_LOCAL_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      RCLONE_CONFIG_LOCAL_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: ["mkdir", "local:${S3_BUCKET}"]

  # FastAPI in dev mode: the `base` image stage (deps only) with the source bind-mounted so
  # uvicorn --reload picks up edits; entrypoint.dev.sh runs `alembic upgrade head` first.
  # Build context is the repo root so the Dockerfile can also copy packages/schemas.
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: base
    command: ["sh", "/app/entrypoint.dev.sh"]
    working_dir: /app
    environment:
      # The bind mount below hides the image's copy of the schema, so point the validator
      # at the read-only package mount instead (see app/content/prose.py candidates).
      PROSE_SCHEMA_PATH: /packages/schemas/prose-doc.schema.json
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      # The docker-internal S3_ENDPOINT (storage:9000) isn't reachable from a host-side
      # browser; presigned URLs need the published port instead so direct-to-storage
      # uploads/downloads (media presign flow) work from outside the compose network.
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      ENV: ${ENV}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      UV_PROJECT_ENVIRONMENT: /opt/venv # keep the venv in a volume, not in the bind mount
    volumes:
      - ../apps/api:/app # live source for reload
      - ../packages/schemas:/packages/schemas:ro # prose-doc.schema.json for the validator
      - api-venv:/opt/venv
    depends_on:
      db:
        condition: service_healthy
    # Healthy = the API answers its own /health (which also checks the DB); the 30 s start
    # period covers the migration run on first boot.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # SvelteKit dev server (Vite + HMR). Runs from the bind-mounted repo; node_modules live in
  # named volumes so the Linux container never fights the host's macOS/Windows installs.
  # First start runs `pnpm install` (slow) — hence the 120 s healthcheck start period.
  web:
    image: node:24-bookworm-slim
    working_dir: /repo
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm --filter web dev"]
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL} # server-side calls go straight to api:8000
      ORIGIN: ${ORIGIN} # sent as the Origin header on server-side POSTs (API CSRF check)
    volumes:
      - ..:/repo
      - web-node-modules:/repo/node_modules
      - web-app-node-modules:/repo/apps/web/node_modules
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    # The node image has no curl; use node's fetch to probe SvelteKit's /health route.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # Caddy: the single origin the browser talks to (http://localhost:8080). /api/* → api,
  # everything else → web. Same-origin is what lets the session cookie flow to both without
  # CORS (ADR-0002). Routing rules live in ./Caddyfile.
  proxy:
    image: caddy:2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:8080"
    depends_on:
      - web
      - api

  # Catches every outgoing e-mail in dev (password reset in plan 2): SMTP on :1025, UI on :8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

# Named volumes: database files, object storage, the API venv, and the two node_modules trees.
volumes:
  pgdata:
  storage-data: # SeaweedFS data; the old `minio-data` volume is orphaned and can be pruned
  api-venv:
  web-node-modules:
  web-app-node-modules:
